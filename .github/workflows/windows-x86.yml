name: Windows x86 build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32 / x86)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Win32 plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: BeckyAntiSpam-Win32
          path: build/Release/BeckyAntiSpam.dll
          if-no-files-found: error
